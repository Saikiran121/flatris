apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flatris-hpa
  namespace: flatris
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flatris
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: AverageValue
        averageValue: 400Mi
