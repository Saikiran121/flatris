apiVersion: v1
kind: ResourceQuota
metadata:
  name: flatris-quota
  namespace: flatris
spec:
  hard:
    pods: "20"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "10"
    limits.memory: 16Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: flatris-limits
  namespace: flatris
spec:
  limits:
  - default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 250m
      memory: 256Mi
    type: Container
